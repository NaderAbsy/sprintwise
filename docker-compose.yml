# Local Postgres for development and end-to-end tests. Production uses Neon or Supabase.
# Bound to this machine (127.0.0.1) so nobody else on the network can reach it, even with the default password.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sprintwise
      POSTGRES_PASSWORD: sprintwise
      POSTGRES_DB: sprintwise
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
