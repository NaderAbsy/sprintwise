name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sprintwise
          POSTGRES_PASSWORD: sprintwise
          POSTGRES_DB: sprintwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sprintwise"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sprintwise:sprintwise@localhost:5432/sprintwise
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      # The browser is kept between runs. A download that hangs (it once stalled a run for 19 minutes)
      # times out after 4 minutes and is tried once more, instead of waiting for the job's limit.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the test browser
        timeout-minutes: 10
        run: |
          what=$([ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ] && echo "install-deps chromium" || echo "install --with-deps chromium")
          for attempt in 1 2; do
            timeout 240 pnpm exec playwright $what && exit 0
            echo "Attempt $attempt didn't finish in 4 minutes; trying again."
          done
          exit 1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
